# Copy to config.toml and edit. config.toml is git-ignored.

[xmpp]
jid = "claude-bot@example.org"
# password = "..."              # or leave unset and export XMPP_PASSWORD
room = "claude@conference.example.org"   # must be non-anonymous; members-only recommended
nick = "claude"
# room_password = "..."

[access]
# Real (bare) JIDs allowed to talk to Claude. Messages from anyone else are ignored.
allowed_jids = ["alice@example.org"]

[claude]
cwd = "."                       # relative paths are resolved against this file's directory
                                # in Docker: cwd = "/workspace"
# model = "claude-sonnet-5-5"
permission_mode = "default"     # default | acceptEdits | plan | dontAsk | auto | bypassPermissions
allowed_tools = []              # tools that never need approval, e.g. ["Read", "Grep", "Glob"]
setting_sources = ["user", "project", "local"]
allow_bypass = false            # must be true to use bypassPermissions (config or /mode)

# MCP servers for Claude, same fields as Claude Code's .mcp.json. ${VAR} in any
# value is replaced by that environment variable (startup fails if it's unset),
# so secrets can stay in .env. Tools are named mcp__<name>__<tool>; add
# "mcp__<name>" to allowed_tools to skip approval for all of a server's tools.
# [mcp_servers.sfar]
# url = "http://mcp.example.org:1234/mcp"            # type defaults to "http" ("sse" also works)
# headers = { Authorization = "Bearer ${SFAR_TOKEN}" }
#
# [mcp_servers.files]
# command = "npx"                                     # stdio server, run inside the container
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
# env = { SOME_VAR = "value" }

[ui]
verbosity = "normal"            # quiet | normal | verbose
max_chunk = 3000                # max characters per XMPP message
# approval_timeout = 600        # seconds before an unanswered prompt is denied
